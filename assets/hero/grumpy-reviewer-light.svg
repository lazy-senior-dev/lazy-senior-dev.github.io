<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 284" role="img" aria-label="The Grump: an agent's change flows through the persona, which refuses the write until the findings are fixed, so the branch stays clean.">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .b{font-size:12px;font-weight:700}.xs{font-size:9.5px;letter-spacing:.08em}
    .num{font-size:22px;font-weight:700}
    .cap{font-size:10px;font-weight:700;letter-spacing:.18em}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
    @keyframes steam{0%{opacity:0;transform:translateY(4px) scale(.9)}35%{opacity:.9}100%{opacity:0;transform:translateY(-16px) scale(1.15)}}
    @keyframes sweep{to{transform:rotate(360deg)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes rspin{to{transform:rotate(-360deg)}}
    @keyframes ping{0%,100%{opacity:.25;r:3}50%{opacity:1;r:5}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes settle{0%,55%{fill:var(--w)}70%,100%{fill:var(--o)}}
    @keyframes glow{0%,100%{opacity:.20}50%{opacity:.42}}
    @keyframes dash{to{stroke-dashoffset:-40}}
    .bob{animation:bob 3.4s ease-in-out infinite}
    .eye{animation:blink 4.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
    .st{animation:steam 2.6s ease-in-out infinite}
    .s2{animation-delay:.5s}.s3{animation-delay:1s}
    .sweep{animation:sweep 3.6s linear infinite;transform-origin:0 0}
    .sp-s{animation:spin 16s linear infinite;transform-origin:0 0}
    .sp-r{animation:rspin 11s linear infinite;transform-origin:0 0}
    .ping{animation:ping 1.9s ease-in-out infinite}
    .wire{animation:dash 1.6s linear infinite}
    .glow{animation:glow 4s ease-in-out infinite}
    .dot{--w:#f43f5e;--o:#22c55e;animation:settle 4.4s ease-in-out infinite}
    .r1 .dot{animation-delay:.35s}.r2 .dot{animation-delay:.7s}.r3 .dot{animation-delay:1.05s}
    .vrow{animation:pulse 4.4s ease-in-out infinite}
    .v1{animation-delay:1.45s}.v2{animation-delay:2.9s}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <radialGradient id="g-light">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity=".38"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="880" height="284" rx="18" fill="#fbfcff"/>
  <circle class="glow" cx="452" cy="142" r="128" fill="url(#g-light)"/>
  <text x="24"  y="34" class="mono cap" fill="#f43f5e">AGENT · WRITES</text>
  <text x="386" y="34" class="mono cap" fill="#f59e0b">REVIEWED · GATED</text>
  <text x="596" y="34" class="mono cap" fill="#22c55e">BRANCH · CLEAN</text>
  
    <g class="row r0">
      <rect x="24" y="62" width="252" height="34" rx="9" fill="#ffffff" stroke="#dfe6f5"/>
      <rect x="24" y="62" width="3.5" height="34" rx="2" fill="#f59e0b" opacity=".9"/>
      <text x="38" y="76" class="mono b" fill="#0f1729">auth.py</text>
      <text x="38" y="89" class="mono xs" fill="#f43f5e">unchecked .get()</text>
      <circle class="dot" cx="262" cy="79" r="4" fill="#f43f5e"/>
    </g>
    <g class="row r1">
      <rect x="24" y="106" width="252" height="34" rx="9" fill="#ffffff" stroke="#dfe6f5"/>
      <rect x="24" y="106" width="3.5" height="34" rx="2" fill="#f59e0b" opacity=".9"/>
      <text x="38" y="120" class="mono b" fill="#0f1729">api.ts</text>
      <text x="38" y="133" class="mono xs" fill="#f43f5e">no timeout</text>
      <circle class="dot" cx="262" cy="123" r="4" fill="#f43f5e"/>
    </g>
    <g class="row r2">
      <rect x="24" y="150" width="252" height="34" rx="9" fill="#ffffff" stroke="#dfe6f5"/>
      <rect x="24" y="150" width="3.5" height="34" rx="2" fill="#f59e0b" opacity=".9"/>
      <text x="38" y="164" class="mono b" fill="#0f1729">deploy.yml</text>
      <text x="38" y="177" class="mono xs" fill="#f43f5e">secret in env</text>
      <circle class="dot" cx="262" cy="167" r="4" fill="#f43f5e"/>
    </g>
    <g class="row r3">
      <rect x="24" y="194" width="252" height="34" rx="9" fill="#ffffff" stroke="#dfe6f5"/>
      <rect x="24" y="194" width="3.5" height="34" rx="2" fill="#f59e0b" opacity=".9"/>
      <text x="38" y="208" class="mono b" fill="#0f1729">db.go</text>
      <text x="38" y="221" class="mono xs" fill="#f43f5e">N+1 query</text>
      <circle class="dot" cx="262" cy="211" r="4" fill="#f43f5e"/>
    </g>
  <path id="f0-light" class="wire" d="M280 79 C 336 79, 368 142, 414 142" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity=".45" stroke-dasharray="4 6"/>
    <circle r="3.2" fill="#f59e0b"><animateMotion dur="2.4s" repeatCount="indefinite" path="M280 79 C 336 79, 368 142, 414 142"/></circle><path id="f1-light" class="wire" d="M280 123 C 336 123, 368 142, 414 142" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity=".45" stroke-dasharray="4 6"/>
    <circle r="3.2" fill="#f59e0b"><animateMotion dur="2.75s" repeatCount="indefinite" path="M280 123 C 336 123, 368 142, 414 142"/></circle><path id="f2-light" class="wire" d="M280 167 C 336 167, 368 142, 414 142" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity=".45" stroke-dasharray="4 6"/>
    <circle r="3.2" fill="#f59e0b"><animateMotion dur="3.0999999999999996s" repeatCount="indefinite" path="M280 167 C 336 167, 368 142, 414 142"/></circle><path id="f3-light" class="wire" d="M280 211 C 336 211, 368 142, 414 142" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity=".45" stroke-dasharray="4 6"/>
    <circle r="3.2" fill="#f59e0b"><animateMotion dur="3.4499999999999997s" repeatCount="indefinite" path="M280 211 C 336 211, 368 142, 414 142"/></circle>
  <g transform="translate(452 142)">
    <g class="bob">
      <path d="M-26 -14 h44 v30 a14 14 0 0 1 -14 14 h-16 a14 14 0 0 1 -14 -14 z" fill="#f59e0b" opacity=".18" stroke="#f59e0b" stroke-width="2.5"/>
      <path d="M18 -6 h10 a10 10 0 0 1 0 20 h-10" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
      <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity=".85">
        <path class="st s1" d="M-14 -20 q-5 -10 0 -18"/><path class="st s2" d="M-2 -22 q-5 -11 0 -20"/><path class="st s3" d="M10 -20 q-5 -10 0 -18"/>
      </g>
      <g fill="#0f1729"><circle class="eye" cx="-9" cy="6" r="2.6"/><circle class="eye" cx="9" cy="6" r="2.6"/></g>
      <path d="M-9 20 q9 -6 18 0" fill="none" stroke="#0f1729" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
    </g></g>
  <text x="452" y="206" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#0f1729">The Grump</text>
  <text x="452" y="222" text-anchor="middle" class="mono xs" fill="#5a6b8c">ONLY WHAT BREAKS · ALWAYS ON</text>
  <rect x="584" y="80" width="272" height="132" rx="12" fill="none" stroke="#dfe6f5" opacity=".7"/>
  
    <g class="vrow v0">
      <rect x="596" y="96" width="248" height="30" rx="8" fill="#ffffff" stroke="#dfe6f5"/>
      <circle cx="614" cy="111" r="4.5" fill="#22c55e"/>
      <text x="628" y="115" class="mono b" fill="#22c55e">APPROVE</text>
    </g>
    <g class="vrow v1">
      <rect x="596" y="136" width="248" height="30" rx="8" fill="#ffffff" stroke="#dfe6f5"/>
      <circle cx="614" cy="151" r="4.5" fill="#f59e0b"/>
      <text x="628" y="155" class="mono b" fill="#f59e0b">REQUEST_CHANGES</text>
    </g>
    <g class="vrow v2">
      <rect x="596" y="176" width="248" height="30" rx="8" fill="#ffffff" stroke="#dfe6f5"/>
      <circle cx="614" cy="191" r="4.5" fill="#f43f5e"/>
      <text x="628" y="195" class="mono b" fill="#f43f5e">BLOCK</text>
    </g>
  <text x="596" y="242" class="mono xs" fill="#5a6b8c">DEFECTS REACHING THE BRANCH</text>
       <text x="596" y="264" class="mono num" fill="#f43f5e">22%</text>
       <text x="648" y="264" class="mono num" fill="#5a6b8c">→</text>
       <text x="674" y="264" class="mono num" fill="#22c55e">3%</text>
       <text x="715" y="264" class="mono xs" fill="#5a6b8c">measured, IBM Bob Shell</text>
</svg>